name: website

# Site layout:
#   index.html                      from website/ (current commit)
#   install.sh, install.ps1,        from the newest v* tag
#   install.py
#   releases/<tag>/install.{sh,ps1,py}   for every v* tag
# The scripts download install.py from their own releases/<tag>/ folder and
# check its pinned SHA-256, so the repository itself can stay private.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # all tags
      - name: Assemble site
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          [ -n "$latest" ] || { echo "no v* tags"; exit 1; }
          echo "newest release: $latest"
          mkdir -p _site
          cp website/index.html _site/
          touch _site/.nojekyll
          for tag in $(git tag -l 'v*'); do
            mkdir -p "_site/releases/$tag"
            for f in install.sh install.ps1 install.py; do
              git show "$tag:$f" > "_site/releases/$tag/$f"
            done
          done
          cp "_site/releases/$latest/install.sh" "_site/releases/$latest/install.ps1" \
             "_site/releases/$latest/install.py" _site/
          echo "LATEST=$latest" >> "$GITHUB_ENV"
      - name: Newest release is self-consistent
        run: |
          set -euo pipefail
          want=$(sha256sum "_site/install.py" | cut -d' ' -f1)
          grep -q "^PGZ_VERSION=\"$LATEST\"$" _site/install.sh
          grep -q "^PGZ_INSTALL_PY_SHA256=\"$want\"$" _site/install.sh
          grep -q "^\$PgzVersion = \"$LATEST\"$" _site/install.ps1
          grep -q "^\$PgzInstallPySha256 = \"$want\"$" _site/install.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Run the exact commands from the website against the live site.
  live-unix:
    needs: deploy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: curl | bash from the website
        run: curl -fsSL https://kylerchan.github.io/pygamezero-installer/install.sh | bash

  live-windows:
    needs: deploy
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: irm | iex from the website
        run: |
          irm https://kylerchan.github.io/pygamezero-installer/install.ps1 | iex
          if ($LASTEXITCODE -ne 0) { exit 1 }
